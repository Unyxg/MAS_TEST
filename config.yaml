# MAS-QA-Bridge configuration
# ---------------------------------------------------------------------------
# Do NOT commit a real PAT. Leave `pat` empty and set the ADO_PAT environment
# variable instead (it takes precedence over this file).
#
# EDITING RULES (YAML):
#   * Put values BETWEEN the quotes:      pat: "your-token"      (not  pat: ""  your-token)
#   * Indent with spaces, never tabs.
#   * Windows paths: use SINGLE quotes or forward slashes:
#         default_executable: 'C:\Program Files\MyApp\MyApp.exe'
#         default_executable: "C:/Program Files/MyApp/MyApp.exe"

ado:
  organization: "your-organization"      # https://dev.azure.com/<organization>
  project: "Your Project"                # the name right AFTER the organization in your address:
                                         #   https://dev.azure.com/<organization>/<PROJECT>   or
                                         #   https://<organization>.visualstudio.com/<PROJECT>
  pat: ""                                # prefer: setx ADO_PAT "<token>"
  test_plan_id: 0                        # plan pre-selected in the Test Explorer
  base_url: "https://dev.azure.com"      # normally leave as is. Old-style address: "https://<organization>.visualstudio.com"
                                         # Azure DevOps Server (on-premises): "https://server/tfs"
  api_version: "7.1"
  attachment_api_version: "7.1-preview.1"
  attachment_target: "result"            # result | run | both
  step_attachments: true                 # step screenshots attach to that step
  run_name_prefix: "MAS-QA-Bridge"
  timeout_seconds: 30
  verify_ssl: true

bug:
  # Agile process: Bug = Title, Repro Steps, System Info, Found In, Severity, Priority,
  # Area/Iteration, Assigned To, Tags. "Found In" is the .exe's ProductVersion.
  work_item_type: "Bug"
  default_area_path: ""                  # e.g. "Your Project\\Order Entry" (empty = project root)
  default_iteration_path: ""             # e.g. "Your Project\\Sprint 42"
  default_assigned_to: ""                # REQUIRED for your setup: e.g. "dev.lead@company.com"
  default_severity: "3 - Medium"
  tags: ["MAS-QA-Bridge"]
  app_version: ""                        # leave empty: read from the .exe (matches the developers' build)
  include_machine_name: true             # add the tester's machine name to Environment
  extra_fields: {}                       # custom required fields, e.g. {"Custom.Team": "Checkout"}

app:
  default_executable: ""                 # e.g. 'C:\Program Files\MyApp\MyApp.exe'  (single quotes!)
  launch_args: []                        # e.g. ["--test-mode"]
  window_title_contains: ""              # optional filter to skip splash screens
  window_find_timeout_seconds: 20
  embed_mode: "reparent"                 # reparent (SetParent) | dock (overlay)
  run_as: "current"                      # current | admin | user (default of the "Run as" selector)
  run_as_account: ""                     # e.g. "CONTOSO\\qa.tester2" pre-filled for "different user"
  on_exit: "release"                     # release | terminate

evidence:
  output_dir: "temp_evidence"            # relative to the project folder
  format: "GIF"                          # GIF | MP4 (default recording format)
  fps: 8
  max_seconds: 180                       # capture auto-stops after this
  max_width: 1280                        # frames are downscaled to this width
  jpeg_quality: 90                       # in-memory frame compression
  memory_budget_mb: 512                  # GIF is downscaled further to fit
  auto_stop_on_publish: true             # Publish stops + attaches an active recording
